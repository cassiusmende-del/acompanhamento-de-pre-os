name: historico-precos

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-precos}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
  POSTGRES_DB: ${POSTGRES_DB:-precos}

x-database-url: &database-url postgresql://${POSTGRES_USER:-precos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-precos}?schema=public

services:
  db:
    image: postgres:16-alpine
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Exposto apenas na máquina local (útil para `npm run dev`).
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: *database-url
      APP_PASSWORD: ${APP_PASSWORD:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-precos}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-precos}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
